[project]
name = "declusor-py-socket"
version = "0.1.0"
description = "Cross-platform Python socket transport client plugin for Declusor."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "declusor>=0.3.1",
]

[project.entry-points."declusor.plugins"]
py_socket = "declusor_py_socket:PySocketPlugin"

[project.optional-dependencies]
testing = [
    "pytest>=8.3.4,<9",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[tool.mypy]
python_version = "3.7"
strict = true
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "assets.modules.*"
disable_error_code = ["name-defined"]
