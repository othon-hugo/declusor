[project]
name = "declusor-py-socket"
version = "0.1.0"
description = "Cross-platform Python socket transport client plugin for Declusor."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "declusor>=0.3.1",
]

[project.entry-points."declusor.plugins"]
py_socket = "declusor_py_socket:PySocketPlugin"

[project.optional-dependencies]
testing = [
    "pytest>=8.3.4,<9",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[tool.uv.sources]
declusor = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"assets/**" = ["F821"]
"assets/launchers/*.py" = ["I001", "F821", "E702", "E501", "W292"]

[tool.ruff.format]
exclude = ["assets/**"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
show_error_codes = true
warn_unused_ignores = true
mypy_path = "../../src:src:.:assets/helpers"
exclude = ["assets/.*"]

[tool.pyright]
extraPaths = [
    "src",
    "assets/helpers",
]
