[project]
name = "declusor-plugin-shell-socket"
version = "0.1.0"
description = "POSIX shell socket transport client plugin for Declusor."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "declusor>=0.3.1",
]

[project.entry-points."declusor.plugins"]
shell_socket = "shell_socket:ShellSocketPlugin"

[project.optional-dependencies]
testing = [
    "pytest>=8.3.4,<9",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"
